<div class="form">
<h1>Registrar Libros</h1>
<form (ngSubmit)="agregar()">
    
    <label>Titulo:</label>
    <input type="text" id="titulo" name="titulo" [(ngModel)]="titulo" required>
    <br>
    <label>Autor:</label>
    <input type="text" id="autor" name="autor" [(ngModel)]="autor" required>
    <br>
    <button type="submit">Agregar Libro</button>
    @if (bajarPosicion !== -1) {
        <button type="button" (click)="limpiar()">Cancelar</button>
    }

 </form>

</div>



<p>Cantidad de libros es: {{libros.length}} </p>

@if (libros.length === 0) {
    <p>No hay libros registrados</p>
}
<table border="3">
    <tr>
        <th>ID</th>
        <th>Titulo</th>
        <th>Autor</th>
        <th>Acciones</th>
    </tr>

    @for (libro of libros; track libro.id; let i = $index) {
        <tr>
            <td>{{libro.id}}</td>
            <td>{{libro.titulo}}</td>
            <td>{{libro.autor}}</td>
            <td>
                <button type="button" (click)="editar(i)">Editar</button>
                <button type="button" (click)="eliminar(i)">Eliminar</button>
            </td>
        </tr>
    }
</table>

<button type="button" (click)="cerrarSesion()">Cerrar Sesion</button>
